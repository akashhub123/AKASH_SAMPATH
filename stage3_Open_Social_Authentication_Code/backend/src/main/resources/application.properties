spring.application.name=ElectricityBillManagementSystem

server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=${SPRING_DATASOURCE_URL}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# Frontend URL used after Google login
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email

# Google account that should receive ADMIN role
app.security.google-admin-email=${GOOGLE_ADMIN_EMAIL:}
